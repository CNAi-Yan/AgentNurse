spring:
  application:
    name: agent-nurse

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agent_nurse}?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8080
  servlet:
    context-path: /api

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时（毫秒）

# 日志配置
logging:
  level:
    com.agentnurse: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
